[tool:pytest]
# Configuration pytest pour GS1 DataMatrix API

# Répertoires de tests
testpaths = tests

# Patterns de découverte
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options par défaut
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=85

# Markers personnalisés
markers =
    critical: Tests critiques de non-régression GS1
    slow: Tests lents (> 1 seconde)
    integration: Tests d'intégration
    unit: Tests unitaires
    conformity: Tests de conformité standards
    performance: Tests de performance
    gs1: Tests spécifiques GS1 DataMatrix

# Filtres de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Configuration de coverage
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */env/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.: