[pytest]
# Configuration pytest pour GS1 DataMatrix API

# Répertoires de tests
testpaths = tests

# Patterns de découverte
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options par défaut.
# La couverture n'est PAS activée par défaut : elle est opt-in via
# `make test-coverage` (qui passe --cov / --cov-fail-under explicitement).
# La mettre ici gaterait chaque run, y compris les cibles unitaires, sur une
# couverture globale inatteignable localement (modules JVM/images non testables).
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config

# Markers personnalisés
markers =
    critical: Tests critiques de non-régression GS1
    slow: Tests lents (> 1 seconde)
    integration: Tests d'intégration
    unit: Tests unitaires
    conformity: Tests de conformité standards
    performance: Tests de performance
    gs1: Tests spécifiques GS1 DataMatrix

# Filtres de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# La configuration de couverture vit dans .coveragerc (les sections
# [coverage:*] ne sont pas lues depuis un pytest.ini autonome).